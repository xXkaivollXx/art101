<!DOCTYPE html>
<html lang="en">

<head>
    <!-- All techy stuff goes here, inside HEAD -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Overall title of your page -->
    <title>Creatures Garden</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="creature.css">
    <!-- jQuery library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Link to external JavaScript file -->
    <script src="creature.js" DEFER></script>

    <link href="https://fonts.cdnfonts.com/css/tecate" rel="stylesheet">


</head>

<body>
    <!-- Main content goes here, inside BODY -->

    <h1>Creature's Garden</h1>

    <!-- ADD CREATURES TO THE GARDEN -->

    <!-- adding creatures -->
    <div id="creature-form">
        <div>Name: <input type="text" id="crName" placeholder="More than 2 symbols"> </div>
        <div>Color: <input type="color" id="crColor"> </div>
        <div>Number of Eyes: <input type="number" id="crEyesNum" max="5" min="0" value="1"> </div>
        <div><input type="checkbox" id="crRandom" value="yes"> <label for="crRandom">Randomize<label></div>
        <button id="add-creature">Let It Roam</button>
        <p>
        <div> <button id="crAdd">Add Creature</button> </div>
        </p>
    </div>

    <!-- showing creatures -->
    <div id="creature-list"> </div>

</html>
